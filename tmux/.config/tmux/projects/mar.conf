# mar — ~/project/marirally_project
# name|subdir|command   (runs via sh -c; the window survives its command)
ai-fe|apps/mari-rally-roadbook|AI_WINDOW_NAME=ai-fe $HOME/.local/bin/ai mar:apps/mari-rally-roadbook opencode; exec bash
ai-be|apps/mari-rally-backend-api|AI_WINDOW_NAME=ai-be $HOME/.local/bin/ai mar:apps/mari-rally-backend-api opencode; exec bash
ai-mob|apps/mari-rally-time-control-mobile-app|AI_WINDOW_NAME=ai-mob $HOME/.local/bin/ai mar:apps/mari-rally-time-control-mobile-app claude; exec bash
logs|.|docker compose -f docker-compose.dev.yml logs -f --tail=100 backend-api tracker-server roadbook-web; exec bash
mob|apps/mari-rally-time-control-mobile-app|flutter run; exec bash
mob-log|.|adb logcat -v time || true; exec bash

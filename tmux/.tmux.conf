# ~/.tmux.conf
#
# Design: tmux owns the world OUTSIDE the editor (panes, windows, sessions).
# Neovim owns the world INSIDE it. The same mnemonic letter means the same
# concept in both, at different scopes:
#
#     concept      tmux          neovim
#     split right  C-a |         <leader> |
#     split below  C-a -         <leader> -
#     close        C-a x (pane)  <leader> wd (window)
#     zoom         C-a z         (none; <C-w>o keeps only the current window)
#     find         C-a f (tmux sessions)   <leader> ff (files)
#
# Full Neovim key list: docs/keymaps.md.
#
# THE INVARIANT: the root key-table stays EMPTY. tmux intercepts exactly one key
# in the whole system — the C-a prefix. Every other keystroke passes through
# untouched to the pane. That is what keeps C-l (clear screen) and C-k
# (kill-line) working in bash and Claude Code, and keeps every Neovim binding
# reachable.
#
# So: never add `bind -n`. Any root binding is a key permanently stolen from
# bash, Neovim, and Claude Code alike.

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix          # C-a C-a sends a literal C-a (e.g. start-of-line in shell)

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

# Mouse: click to select pane/window, drag borders to resize, scroll to scrollback
set -g mouse on

# 1-based indexing for windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on    # keep numbering gapless after a window closes

# Quality-of-life
set -g history-limit 50000
set -sg escape-time 10        # don't swallow Esc-prefixed keys (vim, readline)
set -g display-time 2000      # leave messages up long enough to actually read
set -g repeat-time 400        # window for -r repeats; only the resize keys use it

# Neovim's FocusGained/FocusLost autocommands (:checktime, autoread, plugin focus
# hooks) never fire without this.
set -g focus-events on

# ---------------------------------------------------------------------------
# Terminal capabilities
# ---------------------------------------------------------------------------

# --- Claude Code ---
# Required by Anthropic's docs to run Claude Code under tmux:
# Let OSC sequences reach the outer terminal, or desktop notifications and the
# progress bar get swallowed by tmux.
set -g allow-passthrough on
# Extended keys, so tmux can tell Shift+Enter from Enter on terminals that can send
# them. IMPORTANT: this matches TERM=xterm* only. Alacritty reports TERM=alacritty and
# implements only the kitty keyboard protocol, which tmux cannot relay; tmux can only
# ask for xterm's modifyOtherKeys, which Alacritty ignores (verified: Shift+Enter and
# Ctrl+. both reach panes as plain Enter / nothing inside tmux on Alacritty).
# Shift+Enter in Claude Code under Alacritty is therefore handled by a key binding in
# alacritty.toml (Shift+Enter sending ESC CR), not by a tmux setting.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Not from Anthropic's docs, but this terminal advertises COLORTERM=truecolor
# and xterm-256color's terminfo lacks the RGB cap — without this, Claude Code's
# hex-based themes get quantized to 256 colors.
set -as terminal-features ',*:RGB'

# Coloured underlines. Alacritty's terminfo has the underline STYLE (Smulx) but not
# the underline COLOUR (Setulc), so Neovim's diagnostic undercurls would lose their
# red/yellow/blue. Alacritty supports SGR 58; this tells tmux to use it.
# (Cursor shape and the OSC 52 clipboard need no entry: alacritty's terminfo already
# provides Ss/Se and Ms.)
set -as terminal-features 'alacritty*:usstyle'

# wl-copy needs WAYLAND_DISPLAY. tmux's default update-environment list predates
# Wayland and omits it, so panes spawned after a re-attach would copy into a dead
# socket.
set -ga update-environment WAYLAND_DISPLAY

# ---------------------------------------------------------------------------
# Panes — split, close, zoom, navigate, resize
# ---------------------------------------------------------------------------

# | and - are chosen to LOOK like the split they produce. New panes and windows
# inherit the current pane's directory; tmux's default is to start at $HOME,
# which is almost never what you want.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind x kill-pane              # no confirm prompt
bind X kill-window

# Deliberately NOT bound with -r. With repeat enabled tmux keeps the prefix table
# alive for repeat-time after the jump, so moving to a pane and immediately
# typing a word beginning with h/j/k/l would lose that first letter.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize DOES repeat — that is the whole point, and a capital is not something
# you type by accident straight after resizing.
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# `l` above took over tmux's default last-window binding, so it moves here.
bind Tab last-window

# `z` (zoom) and `;` (last pane) are tmux defaults and need no binding.

# ---------------------------------------------------------------------------
# Windows and sessions
# ---------------------------------------------------------------------------

bind c new-window -c "#{pane_current_path}"
bind f choose-tree -Zs        # session/window switcher; built in, needs no fzf
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Copy mode — vi keys, to match Neovim's visual mode
# ---------------------------------------------------------------------------

setw -g mode-keys vi

# OSC 52, belt-and-braces with the wl-copy pipes below: this path still works when
# tmux is running on the far end of an SSH connection, where wl-copy would be
# talking to the remote machine's nonexistent compositor.
set -g set-clipboard on

bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# ---------------------------------------------------------------------------
# Appearance
# ---------------------------------------------------------------------------

# Colours: Catppuccin Mocha, the same palette as Neovim (catppuccin.nvim + lualine) and
# Alacritty. Hex colours rely on the RGB terminal feature set above.
#
#   mantle   #181825  bars (lualine's section-c background)
#   base     #1e1e2e  text on the blue accent
#   surface0 #313244  raised blocks      surface1 #45475a  inactive borders
#   overlay0 #6c7086  muted text         subtext0 #a6adc8  normal bar text
#   text     #cdd6f4                     blue     #89b4fa  the accent (Neovim's NORMAL mode)
#   rosewater #f5e0dc selection, as in alacritty.toml

set -g status-position top
set -g status-style 'bg=#181825 fg=#a6adc8'
set -g status-left '#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=#89b4fa,bg=#313244] %H:%M '
set -g window-status-format '#[fg=#6c7086] #I #W '
set -g window-status-current-format '#[fg=#89b4fa,bold] #I #W '

# Pane borders carry a label: the pane's index (1-based, see pane-base-index) and the
# command it is running, e.g. "2 nvim" or "1 claude". tmux's own pane title (#T) is the
# hostname unless a program sets it, so it is not used. The active pane is blue.
set -g pane-border-status top
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g pane-border-format '#{?pane_active,#[fg=#89b4fa bold],#[fg=#6c7086]} #{pane_index} #{pane_current_command} #[default]'

set -g message-style 'bg=#89b4fa fg=#1e1e2e'
set -g message-command-style 'bg=#313244 fg=#cdd6f4'
set -g mode-style 'bg=#f5e0dc fg=#1e1e2e'    # copy-mode selection, same as Alacritty's
set -g display-panes-colour '#6c7086'        # the C-a q pane-number overlay
set -g display-panes-active-colour '#89b4fa'
set -g clock-mode-colour '#89b4fa'

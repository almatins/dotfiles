# picom configuration — Intel Iris Xe, X11
# Hyprland-like look: rounded corners + soft shadows, no animations/blur.
# Backups: picom.conf.bak-<timestamp>-pre-hyprland-style

backend = "glx";
vsync = true;

# Shadows (Hyprland default-ish: soft, offset, subtle)
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'com.mitchellh.ghostty'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "bounding_shaped"
];

# No rounded corners anywhere (matches the Ghostty look). Set corner-radius
# back to 8 and re-add the exclude list if you want Hyprland-style rounding.
corner-radius = 0;

# No blur for now: saves battery on the integrated GPU.
# To try Hyprland-style blur, enable these three:
#   blur-background = true;
#   blur-method = "dual_kawase";
#   blur-strength = 5;
blur-background = false;

# No global transparency; terminals carry their own opacity.
frame-opacity = 1.0;
inactive-opacity = 1.0;
active-opacity = 1.0;

# Slight transparency only for menus and tooltips.
opacity-rule = [
  "95:class_g = 'Rofi'",
  "95:class_g = 'dunst'"
];

# No fade animations anywhere (Hyprland animations are off by request).
wintypes: {
  tooltip       = { shadow = false; opacity = 0.90; fade = false; };
  popup_menu    = { opacity = 1.0; shadow = false; fade = false; };
  dropdown_menu = { opacity = 1.0; shadow = false; fade = false; };
  utility       = { shadow = false; opacity = 0.90; fade = false; };
  dock          = { shadow = false; fade = false; };
  dnd           = { shadow = false; fade = false; };
  notification  = { shadow = false; fade = false; };
};

# Do not composite fullscreen apps (video, games).
unredir-if-possible = true;

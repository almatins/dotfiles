; Polybar — Hyprland-like bar, Catppuccin Mocha
; Run: polybar -c ~/.config/polybar/config.ini main

[colors]
base     = #1e1e2e
mantle   = #181825
surface0 = #313244
surface1 = #45475a
overlay1 = #7f849c
subtext0 = #a6adc8
text     = #cdd6f4
mauve    = #cba6f7
red      = #f38ba8
green    = #a6e3a1
yellow   = #f9e2af

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 34
offset-x = 0
offset-y = 0

background = ${colors.base}
foreground = ${colors.text}
line-size = 2
line-color = ${colors.mauve}
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"

modules-left = i3
modules-center = xwindow
modules-right = pulseaudio memory cpu battery vpn docker flameshot rustdesk date tray

cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = custom/script
; Shows all 10 configured workspaces, even the ones i3 has destroyed because
; they are empty (internal/i3 only lists existing workspaces).
exec = /home/almatins/.config/polybar/scripts/i3-workspaces.sh
tail = true
format-foreground = ${colors.text}

[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 70
label-empty = ""
label-foreground = ${colors.subtext0}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted =  muted
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-right = pavucontrol

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.mauve}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.mauve}
label = %percentage:2%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = <ramp-capacity> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = full


[module/vpn]
type = custom/script
exec = test -d /proc/sys/net/ipv4/conf/tun0 && echo "" || echo ""
interval = 5
format-foreground = ${colors.green}

[module/docker]
type = custom/script
exec = test -f /run/docker.pid && echo " docker" || echo ""
interval = 10
format-foreground = ${colors.mauve}

[module/date]
type = internal/date
interval = 30
date = "%a %d %b"
time = "%H:%M"
format-prefix = " "
format-prefix-foreground = ${colors.mauve}
label = %date%  %time%

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 4

[module/flameshot]
type = custom/text
format = ""
format-foreground = ${colors.overlay1}
click-left = flameshot gui


[module/rustdesk]
type = custom/text
format = ""
format-foreground = ${colors.overlay1}
click-left = rustdesk
